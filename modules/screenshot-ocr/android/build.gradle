plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.screenshotocr'
version = '0.1.0'

android {
  namespace "expo.modules.screenshotocr"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Bundled (not Play Services) model: works offline, no runtime download.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
  // Russian OCR (ML Kit has no Cyrillic model). JitPack; the app's root build.gradle (expo prebuild)
  // already lists https://www.jitpack.io. Standard (single-threaded) variant.
  implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
